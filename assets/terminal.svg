<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="'Fira Code',monospace">
<defs>
  <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111318"/><stop offset="1" stop-color="#08090c"/>
  </linearGradient>
  <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a0000"/><stop offset="1" stop-color="#ff2b2b"/>
  </linearGradient>
  <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="480" height="300" rx="14" fill="url(#termBg)"/>
<rect x="0.5" y="0.5" width="479" height="299" rx="14" fill="none" stroke="#ff2b2b" stroke-opacity="0.35"/>

<!-- title bar -->
<rect width="480" height="34" rx="14" fill="#14161b"/>
<rect y="20" width="480" height="14" fill="#14161b"/>
<circle cx="22" cy="17" r="6" fill="#ff5f56"/>
<circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
<circle cx="66" cy="17" r="6" fill="#27c93f"/>
<text x="240" y="21" text-anchor="middle" font-size="12" fill="#8a9099" letter-spacing="1">vinicius@backend: ~/api</text>

<!-- prompt lines -->
<g font-size="14" fill="#c9ced6">
  <text x="20" y="66"><tspan fill="#ff5252">$</tspan> java -jar api.jar</text>

  <text x="20" y="94" opacity="0">
    <tspan fill="#5f656e">// </tspan><tspan fill="#e9edf2">Starting Spring Boot application...</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="20" y="120" opacity="0">
    <tspan fill="#27c93f">✓</tspan> <tspan fill="#8a9099">Tomcat started on port(s): 8080</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="20" y="146" opacity="0">
    <tspan fill="#27c93f">✓</tspan> <tspan fill="#8a9099">REST API pronta</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="20" y="180" opacity="0">
    <tspan fill="#ff5252">$</tspan> node server.js
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="20" y="206" opacity="0">
    <tspan fill="#27c93f">✓</tspan> <tspan fill="#8a9099">Node.js service ouvindo na porta 3000</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
  </text>

  <text x="20" y="240" opacity="0">
    <tspan fill="#5f656e">status:</tspan> <tspan fill="#ffdcdc" font-weight="700">ONLINE</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.3s" fill="freeze"/>
  </text>
</g>

<!-- blinking cursor -->
<rect x="20" y="252" width="9" height="15" fill="#ff2d2d" filter="url(#tglow)">
  <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.5s" repeatCount="indefinite"/>
</rect>

<!-- bottom accent bar -->
<rect x="0" y="292" width="0" height="4" fill="url(#barGrad)">
  <animate attributeName="width" from="0" to="480" begin="0.1s" dur="1.4s" fill="freeze"/>
</rect>
</svg>
